services:
  mysql:
    image: mysql:8.4
    container_name: travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: gansu_travel3
      MYSQL_USER: travel
      MYSQL_PASSWORD: travelpass
    ports:
      - "3308:3306"
    volumes:
      - travel_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2.15-alpine
    container_name: travel-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - travel_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  travel_mysql_data:
  travel_redis_data:
